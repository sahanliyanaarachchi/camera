<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal Vision - Human Detection</title>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAASopq67qBAg2IoB7lfFsAbAFvfsbSwJA",
    authDomain: "human-detect-19f4f.firebaseapp.com",
    databaseURL: "https://human-detect-19f4f-default-rtdb.firebaseio.com",
    projectId: "human-detect-19f4f",
    storageBucket: "human-detect-19f4f.firebasestorage.app",
    messagingSenderId: "281262323303",
    appId: "1:281262323303:web:6fd0d706a4076d9cff06c2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const infoEl = document.getElementById("info");

  let lastPersonCount = 0;
  let lastUpdate = 0;
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let fps = 0;
  let lastImageUpload = 0;

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      statusEl.textContent = "✅ Camera Active (Thermal Mode)";
    } catch (err) {
      statusEl.textContent = "❌ Camera access denied!";
      console.error(err);
    }
  }

  function applyThermalEffect(imageData) {
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
      const t = brightness / 255;
      const r = Math.min(255, 512 * (t - 0.5));
      const g = Math.min(255, 512 * (0.5 - Math.abs(t - 0.5)));
      const b = Math.min(255, 512 * (0.5 - t));
      data[i] = Math.max(0, r);
      data[i+1] = Math.max(0, g);
      data[i+2] = Math.max(0, b);
    }
    return imageData;
  }

  async function captureAndUpload() {
    const now = Date.now();
    if (now - lastImageUpload < 10000) return; // limit uploads every 10s
    lastImageUpload = now;

    const imageData = canvas.toDataURL("image/jpeg");
    const imageName = `capture_${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`;
    const storageReference = sRef(storage, `captures/${imageName}`);
    await uploadString(storageReference, imageData, 'data_url');
    const url = await getDownloadURL(storageReference);

    await set(ref(db, "humanAlert"), {
      personDetected: true,
      imageUrl: url,
      timestamp: new Date().toISOString()
    });
  }

  async function startDetection() {
    const model = await cocoSsd.load();
    statusEl.textContent = "Model Loaded - Detecting...";

    async function detectFrame() {
      const predictions = await model.detect(video);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      frame = applyThermalEffect(frame);
      ctx.putImageData(frame, 0, 0);

      let personCount = 0;
      let avgScore = 0;

      predictions.forEach(pred => {
        if (pred.class === "person" && pred.score > 0.4) {
          personCount++;
          avgScore += pred.score;
          const [x, y, w, h] = pred.bbox;
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = "white";
          ctx.font = "16px Arial";
          ctx.fillText(`Human ${Math.round(pred.score*100)}%`, x, y-5);
        }
      });

      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime > 1000) { fps = frameCount; frameCount = 0; lastFpsTime = now; }

      if (personCount > 0 && personCount !== lastPersonCount) await captureAndUpload();

      if (personCount !== lastPersonCount || now - lastUpdate > 5000) {
        await set(ref(db, "humanAlert/status"), {
          personDetected: personCount > 0,
          count: personCount,
          timestamp: new Date().toISOString()
        });
        lastPersonCount = personCount;
        lastUpdate = now;
      }

      statusEl.textContent = personCount > 0 ? "🟢 Human Detected" : "🔴 No Human";
      infoEl.innerHTML = `Count: ${personCount} | FPS: ${fps} | Avg Confidence: ${(avgScore/personCount*100 || 0).toFixed(1)}%`;

      requestAnimationFrame(detectFrame);
    }

    detectFrame();
  }

  startCamera().then(startDetection);
</script>

<style>
body { background: #000; color: #0ff; font-family: 'Orbitron', sans-serif; text-align: center; margin: 0; padding: 10px; }
h2 { color: #0ff; text-shadow: 0 0 10px #0ff; }
video, canvas { border: 3px solid #0ff; border-radius: 10px; width: 90%; max-width: 720px; margin-top: 10px; box-shadow: 0 0 20px cyan; }
#status { margin-top: 15px; font-size: 18px; text-shadow: 0 0 10px #0ff; }
#info { margin-top: 10px; font-size: 16px; color: #8ff; }
canvas { filter: contrast(2) saturate(2); }
</style>

</head>
<body>
<h2>🌡️ Thermal Vision - Human Detection</h2>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<div id="status">Initializing...</div>
<div id="info"></div>
</body>
</html>
