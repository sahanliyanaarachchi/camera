<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Body Part Detection</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

<!-- TensorFlow.js & MoveNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<style>
body {background:#000;color:#0f0;font-family:Arial;text-align:center;margin:0;padding:20px;}
video, canvas {border:2px solid #0f0;border-radius:10px;width:90%;max-width:720px;margin-top:10px;}
#status {margin-top:15px;font-size:18px;}
</style>
</head>
<body>
<h2>👁 Human Body Part Detection</h2>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<div id="status">Initializing...</div>
<audio id="alarmSound" src="https://www.soundjay.com/button/sounds/beep-07.mp3" preload="auto"></audio>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeF1gnf_KJvIiRMy-_aSfIIurQq_8l1iI",
  authDomain: "dansal-map-e0185.firebaseapp.com",
  databaseURL: "https://dansal-map-e0185-default-rtdb.firebaseio.com",
  projectId: "dansal-map-e0185",
  storageBucket: "dansal-map-e0185.firebasestorage.app",
  messagingSenderId: "1006285824505",
  appId: "1:1006285824505:web:135f9efdecb03073a15d28",
  measurementId: "G-C8LJT9MD3X"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const alarmSound = document.getElementById("alarmSound");

// Start camera
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1280},height:{ideal:720}}, audio:false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata=r);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    statusEl.textContent = "✅ Camera Active";
  } catch(err){
    statusEl.textContent="❌ Camera access denied!";
    console.error(err);
  }
}

// Body-part detection using MoveNet
async function startDetection(){
  const detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
  statusEl.textContent = "Model Loaded - Detecting...";

  setInterval(async ()=>{
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const poses = await detector.estimatePoses(video);

    let humanDetected=false;

    poses.forEach(pose=>{
      pose.keypoints.forEach(kp=>{
        if(kp.score>0.2){ // Any body part detected
          humanDetected=true;
          ctx.beginPath();
          ctx.arc(kp.x,kp.y,5,0,2*Math.PI);
          ctx.fillStyle='lime';
          ctx.fill();
        }
      });
    });

    // Update Firebase
    await db.ref("humanAlert").set({
      personDetected: humanDetected,
      timestamp: new Date().toISOString()
    });

    // Update UI and sound
    if(humanDetected){
      statusEl.textContent="🟢 Human Detected!";
      if(alarmSound.paused){alarmSound.currentTime=0; alarmSound.play().catch(e=>console.log(e));}
    }else{
      statusEl.textContent="🔴 No Person";
      alarmSound.pause();
    }
  },500); // check every 0.5s
}

startCamera().then(startDetection);
</script>
</body>
</html>
